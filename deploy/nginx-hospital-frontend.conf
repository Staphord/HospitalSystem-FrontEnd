# Install to /etc/nginx/sites-available/hospital-frontend.conf
# SPA from dist/; /api/ reverse-proxied to the gateway on 127.0.0.1:8000.

# HTTP → HTTPS (keep $host so ACME / each cert name still works)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gilgali.com www.gilgali.com vmi3490339.contaboserver.net _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Primary site
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name gilgali.com;

    ssl_certificate /etc/letsencrypt/live/gilgali.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gilgali.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hospital-frontend/dist;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location /api/v1/notifications/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    include /var/www/hospital-frontend/deploy/nginx-svc-proxy.inc;

    # Admin-service Swagger (8018 is localhost-only)
    location ^~ /docs {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://127.0.0.1:8018/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8018/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Keycloak admin console (Docker is localhost-only). Dedicated hostname so
# /admin does not collide with the hospital SPA on gilgali.com.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vmi3490339.contaboserver.net;

    ssl_certificate /etc/letsencrypt/live/vmi3490339.contaboserver.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmi3490339.contaboserver.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    include /var/www/hospital-frontend/deploy/nginx-keycloak.inc;
}
