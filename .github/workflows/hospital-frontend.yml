name: hospital-frontend

on:
  push:
    branches: [ main, staging ]
  repository_dispatch:
    types: [ backend-staging-staged-success, backend-production-deployed-success ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test and Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # repository_dispatch otherwise checks out the default branch — force
          # the branch that matches whichever backend release triggered us:
          # backend-staging-staged-success pairs with our staging branch,
          # backend-production-deployed-success (production) pairs with main.
          ref: >-
            ${{
              github.event.action == 'backend-staging-staged-success' && 'staging' ||
              github.event.action == 'backend-production-deployed-success' && 'main' ||
              github.ref
            }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit and integration tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile=./test-results/junit.xml

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: dist-build
          path: dist/

  # Deploy to Staging on push to staging branch, or when the backend repo
  # signals that it has staged a release (repository_dispatch handshake).
  deploy-staging:
    name: Deploy to Staging VPS
    needs: build-and-test
    if: |
      (github.ref == 'refs/heads/staging' && github.event_name == 'push') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'backend-staging-staged-success')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist-build
          path: dist
      # Raw SSH + rsync deploy
      - name: Sync files to Staging VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          TARGET: "/var/www/hospital-frontend-staging/dist/"
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

          rsync $ARGS \
            -e "ssh -i ~/.ssh/deploy_key" \
            "$SOURCE" "$REMOTE_USER@$REMOTE_HOST:$TARGET"

      # Hand the handshake back to the backend: only relevant when the backend
      # is the one that triggered us, and only fires on a successful deploy.
      - name: Notify Backend of Successful Frontend Deployment
        if: success() && github.event_name == 'repository_dispatch'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: Staphord/HospitalSystem
          event-type: frontend-staging-deployment-succeeded
          client-payload: '{"release_tag": "${{ github.event.client_payload.release_tag }}", "sha": "${{ github.event.client_payload.sha }}", "environment": "${{ github.event.client_payload.environment }}"}'

  # If the build or the staging deploy fails after the backend staged a
  # release, tell the backend so it can clean up the staged release instead
  # of leaving it dangling.
  notify-backend-failure:
    name: Notify Backend of Frontend Staging Deployment Failure
    needs: [ build-and-test, deploy-staging ]
    if: |
      always() &&
      github.event_name == 'repository_dispatch' &&
      (needs.build-and-test.result == 'failure' || needs.deploy-staging.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Backend
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: Staphord/HospitalSystem
          event-type: frontend-staging-deployment-failed
          client-payload: '{"release_tag": "${{ github.event.client_payload.release_tag }}", "sha": "${{ github.event.client_payload.sha }}", "environment": "${{ github.event.client_payload.environment }}"}'

  # Deploy to Production on push to main, or when the backend repo signals
  # that it has deployed and activated a release (repository_dispatch
  # handshake). The backend already stages+activates itself before notifying
  # us, so it doesn't need a success signal back — only failure, so it can
  # roll back.
  deploy-production:
    name: Deploy to Production VPS
    needs: build-and-test
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'backend-production-deployed-success')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist-build
          path: dist

      # Production's /var/www/hospital-frontend holds a full git checkout
      # (unlike staging, which only ever gets the built dist/), so pull the
      # latest main branch from the repo first to ensure the deployed code
      # matches the source code.
      - name: Sync source code on Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/hospital-frontend || exit 1
            git fetch origin
            git checkout main
            git pull origin main

      # Raw SSH + rsync deploy
      - name: Sync files to Production VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          TARGET: "/var/www/hospital-frontend/dist/"
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

          rsync $ARGS \
            -e "ssh -i ~/.ssh/deploy_key" \
            "$SOURCE" "$REMOTE_USER@$REMOTE_HOST:$TARGET"

      
      - name: Notify Backend of Successful Frontend Production Deployment
        if: success() && github.event_name == 'repository_dispatch' && github.event.action == 'backend-production-deployed-success'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: Staphord/HospitalSystem
          event-type: frontend-production-deployment-succeeded
          client-payload: '{"release_tag": "${{ github.event.client_payload.release_tag }}", "sha": "${{ github.event.client_payload.sha }}"}'

  # If the build or the production deploy fails after the backend already
  # activated its release, tell the backend so it can roll itself back —
  # this is the only signal the backend's production pipeline listens for.
  notify-backend-production-failure:
    name: Notify Backend of Frontend Production Deployment Failure
    needs: [ build-and-test, deploy-production ]
    if: |
      always() &&
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'backend-production-deployed-success' &&
      (needs.build-and-test.result == 'failure' || needs.deploy-production.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Backend
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: Staphord/HospitalSystem
          event-type: frontend-production-deployment-failed
          client-payload: '{"release_tag": "${{ github.event.client_payload.release_tag }}", "sha": "${{ github.event.client_payload.sha }}"}'
