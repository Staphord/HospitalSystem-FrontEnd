name: hospital-frontend

on:
  push:
    branches: [ main, staging ]
  # repository_dispatch:
  #   types: [ backend_deploy_success, backend_trigger ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test and Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit and integration tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile=./test-results/junit.xml

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/

  # Deploy to Staging on push to staging branch
  deploy-staging:
    name: Deploy to Staging VPS
    needs: build-and-test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist
      # Raw SSH + rsync deploy
      - name: Sync files to Staging VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          TARGET: "/var/www/hospital-frontend-staging/dist/"
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

          rsync $ARGS \
            -e "ssh -i ~/.ssh/deploy_key" \
            "$SOURCE" "$REMOTE_USER@$REMOTE_HOST:$TARGET"
